name: Apply PWA power controls v2
on:
  push:
    branches: [feature/power-controls-v2]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-controls-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic power controls transform
        run: node tools/apply-power-controls-v2.cjs
      - name: Validate syntax and regressions
        run: |
          node --check app.js
          node --check power-controls.js
          node --check recording-bridge.js
          node --check theme.js
          node --check sw.js
          for test_file in tests/*.cjs; do node "$test_file"; done
      - name: Commit transformed sources
        run: |
          if git diff --quiet; then
            echo "Power controls already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js theme.js recording-bridge.js sw.js tests/*.cjs
          git commit -m "Materialize PWA power controls v2"
          git push origin HEAD:feature/power-controls-v2
